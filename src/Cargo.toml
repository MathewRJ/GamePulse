[package]
name = "rigsignal"
version = "0.3.0"
edition = "2021"
description = "Gaming telemetry agent for Elastic: FPS, frame timing, GPU/CPU/thermal metrics, and game-session detection across Linux, Steam Deck, and Windows"
license = "Apache-2.0"
repository = "https://github.com/MathewRJ/RigSignal"
readme = false
keywords = ["gaming", "telemetry", "metrics", "elasticsearch", "performance"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "rigsignal-agent"
path = "main.rs"

[features]
# Default build ships without eBPF — the agent emits session.json and
# relies on the separate `ebpf/` workspace daemon for kernel-level
# probes. Enable `ebpf` when/if in-agent eBPF integration lands; until
# then this feature is a scaffold that reserves the flag name, gates
# any future aya/ebpf dependencies, and enforces the Linux-only
# constraint at compile time.
default = []
ebpf = []

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
tokio = { version = "1", features = ["full", "test-util"] }
anyhow = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs2 = "0.4"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
# Used only by the handshake probe's protected-source opener (O_NOFOLLOW + fstat).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Com",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
winreg = "0.56.0"

[lints.rust]
# Public API fields deserialized from TOML/config and collectors trait methods are
# intentionally unused in the current codebase — suppress dead_code globally.
dead_code = "allow"

[lints.clippy]
# Pre-existing issues in src/collectors/ (not touched by B.7/B.8 work):
seek_from_current = "allow"
needless_lifetimes = "allow"
manual_div_ceil = "allow"
bind_instead_of_map = "allow"

# ── Debian package metadata (cargo-deb) ─────────────────────────────────────
# Paths are relative to this file's directory (src/).
# Run: cargo deb --manifest-path src/Cargo.toml --no-build --no-strip
[package.metadata.deb]
maintainer = "MathewRJ <https://github.com/MathewRJ>"
copyright = "2026, MathewRJ"
license-file = ["../LICENSE", "0"]
extended-description = """\
RigSignal gaming performance telemetry agent.
Ships CPU, GPU, memory, storage, network, audio, power, and frame metrics
to Elasticsearch for live analysis and historical comparison."""
section = "utils"
priority = "optional"
# Binary auto-inclusion is disabled when assets is set; list it explicitly.
# $auto resolves shared-library dependencies (glibc, etc.) from the binary.
depends = "$auto"
assets = [
    ["../target/release/rigsignal-agent", "usr/bin/rigsignal-agent", "755"],
    ["../packaging/rigsignal-launcher.sh", "usr/bin/rigsignal", "755"],
    ["../packaging/systemd/rigsignal-agent.service", "usr/lib/systemd/user/rigsignal-agent.service", "644"],
    ["../packaging/config/rigsignal.toml.example", "usr/share/rigsignal/examples/rigsignal.toml.example", "644"],
    ["../profiles/starfield.toml", "usr/share/rigsignal/profiles/starfield.toml", "644"],
    ["../profiles/cyberpunk-2077.toml", "usr/share/rigsignal/profiles/cyberpunk-2077.toml", "644"],
    ["../profiles/baldurs-gate-3.toml", "usr/share/rigsignal/profiles/baldurs-gate-3.toml", "644"],
]

# ── WiX MSI metadata (cargo-wix) ─────────────────────────────────────────────
# WiX source lives at .github/packaging/main.wxs (alongside PKGBUILD).
# Run from repo root: cargo wix --no-build --include .github/packaging/main.wxs
# upgrade-guid / path-guid are stable across releases — never change them or
# upgrades stop being detected as upgrades.
[package.metadata.wix]
upgrade-guid = "862FBC47-5257-4EC9-9854-0D10D2B8FD29"
path-guid    = "CC21BF89-4193-4289-8D44-847AA7B6EC72"
license      = false
eula         = false

# ── RPM package metadata (cargo-generate-rpm) ────────────────────────────────
# Paths are relative to this file's directory (src/).
# Run: cargo generate-rpm --manifest-path src/Cargo.toml
[package.metadata.generate-rpm]
license = "Apache-2.0"
summary = "RigSignal gaming performance telemetry agent"
assets = [
    { source = "../target/release/rigsignal-agent", dest = "/usr/bin/rigsignal-agent", mode = "755" },
    { source = "../packaging/rigsignal-launcher.sh", dest = "/usr/bin/rigsignal", mode = "755" },
    { source = "../packaging/systemd/rigsignal-agent.service", dest = "/usr/lib/systemd/user/rigsignal-agent.service", mode = "644" },
    { source = "../packaging/config/rigsignal.toml.example", dest = "/usr/share/rigsignal/examples/rigsignal.toml.example", mode = "644" },
    { source = "../profiles/starfield.toml", dest = "/usr/share/rigsignal/profiles/starfield.toml", mode = "644" },
    { source = "../profiles/cyberpunk-2077.toml", dest = "/usr/share/rigsignal/profiles/cyberpunk-2077.toml", mode = "644" },
    { source = "../profiles/baldurs-gate-3.toml", dest = "/usr/share/rigsignal/profiles/baldurs-gate-3.toml", mode = "644" },
]
