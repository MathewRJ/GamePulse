# ECS fields used in this data stream
- name: host.name
  type: keyword
  dimension: true
  description: "Hostname of the gaming PC"

# Session context
- name: gamepulse
  type: group
  fields:
    - name: session
      type: group
      fields:
        - name: id
          type: keyword
          dimension: true
          description: "Unique session identifier (UUID)"
        - name: agent_version
          type: keyword
          description: "Version of the GamePulse collector agent"

    - name: game
      type: group
      fields:
        - name: name
          type: keyword
          description: "Game title"
        - name: steam_app_id
          type: long
          description: "Steam application ID"

    # Power-specific metrics
    - name: power
      type: group
      fields:
        - name: profile
          type: keyword
          description: "Active power profile (performance, balanced, power-save, custom)"
        - name: battery_pct
          type: float
          metric_type: gauge
          unit: percent
          description: "Battery charge level as a percentage (0–100). Null for non-battery devices."
        - name: battery_rate_w
          type: float
          metric_type: gauge
          description: "Battery charge/discharge rate in watts. Negative = discharging."
        - name: ac_connected
          type: boolean
          description: "True when AC power adapter is connected"
        - name: tdp_current_w
          type: float
          metric_type: gauge
          description: "Current combined CPU+GPU TDP in watts (relevant for handhelds with TDP limits)"
