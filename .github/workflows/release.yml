name: release

# Triggers:
#   • git push of a v* tag (e.g. v0.2.0) — full release flow: build + package + publish
#   • workflow_dispatch — CI test mode: build + package only (no publish, no tag)
#     Use to verify packaging on GitHub runners before cutting a real release.
#     Build artefacts (.deb / .rpm / .pkg.tar.zst / .msi) are uploaded to the
#     workflow run and downloadable from the Actions UI.
#
# Fan-out packaging jobs (Linux + Windows run in parallel):
#   Linux:   .deb (Debian/Ubuntu) · .rpm (Fedora/RHEL/openSUSE) · .pkg.tar.zst (Arch)
#   Windows: .msi (cargo-wix → WiX Toolset 3, ships with windows-latest runners)
#
# eBPF daemon + probes ARE included in the Linux tarball (build-ebpf job uses
# nightly Rust + bpf-linker). install.sh installs them system-wide via sudo.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0 — without leading v)'
        required: true
        type: string

# Residual: out-of-band manual published-release creation in the sub-second window is outside this workflow guard; owners must avoid it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:

  # ── 0. Packaging regression gate ──────────────────────────────────────────
  packaging-tests:
    name: packaging tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check release version consistency
        run: python3 tools/check-release-version --tag "$GITHUB_REF_NAME"

      - name: Test release manifest generator
        run: python3 tools/tests/test_gen_release_manifest.py

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master@2026-07-18
        with:
          toolchain: stable

      - name: Run installer packaging tests
        run: bash tools/tests/test_installer.sh

      - name: Run launcher packaging tests
        run: bash packaging/tests/test-rigsignal-launcher.sh

      - name: Run eBPF workspace tests
        run: cargo test --manifest-path ebpf/Cargo.toml --locked

      - name: Run workspace tests
        run: cargo test --workspace --locked

  # ── 0. Derive version from tag push or workflow_dispatch input ───────────────
  setup:
    name: compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Derive version and tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

  # ── 1. Build Linux x86_64 release binary ────────────────────────────────────
  build-linux:
    name: build (linux x86_64)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master@2026-07-18
        with:
          toolchain: stable

      - name: Cache cargo registry + build artefacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src -> target

      - name: cargo build --release
        run: cargo build --release --manifest-path src/Cargo.toml --locked

      - name: Upload binary artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-binary-linux-x86_64
          path: target/release/rigsignal-agent
          if-no-files-found: error

  # ── 1b. Build eBPF daemon + probes (Linux x86_64, nightly Rust) ─────────────
  build-ebpf:
    name: build ebpf daemon + probes
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Keep the release eBPF toolchain aligned with ebpf/rust-toolchain.toml.
      - name: Install Rust nightly + rust-src (for build-std)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master@2026-07-18
        with:
          toolchain: nightly-2026-07-18
          components: rust-src

      - name: Cache cargo registry + build artefacts (eBPF workspace)
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: ebpf -> ebpf/target
          key: ebpf-nightly

      - name: Install bpf-linker
        run: cargo install bpf-linker --version 0.10.4 --locked

      - name: Build BPF probes + daemon
        run: |
          cd ebpf
          cargo xtask build-all --release

      - name: Stage eBPF binaries (flat, no nested paths in artifact)
        run: |
          mkdir -p ebpf-artifacts
          cp ebpf/target/release/rigsignal-ebpf                             ebpf-artifacts/
          cp ebpf/target/bpfel-unknown-none/release/rigsignal-ebpf-probes   ebpf-artifacts/

      - name: Upload eBPF artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ebpf-binaries-linux-x86_64
          path: ebpf-artifacts/
          if-no-files-found: error

  # ── 2a. Package Linux binary tarball (for install.sh / SteamOS) ─────────────
  package-tarball:
    name: package linux tarball
    needs: [setup, build-linux, build-ebpf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download agent binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-binary-linux-x86_64
          path: target/release/

      - name: Download eBPF binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ebpf-binaries-linux-x86_64
          path: target/ebpf/

      - name: Mark binaries executable
        run: |
          chmod +x target/release/rigsignal-agent
          chmod +x target/ebpf/rigsignal-ebpf

      - name: Build tarball
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          DIR="rigsignal-${VERSION}-linux-x86_64"
          mkdir -p "dist-tar/${DIR}"

          # Agent + launcher + uninstaller + user service
          cp target/release/rigsignal-agent                            "dist-tar/${DIR}/rigsignal-agent"
          cp packaging/rigsignal-launcher.sh                           "dist-tar/${DIR}/rigsignal"
          cp packaging/uninstall.sh                                    "dist-tar/${DIR}/rigsignal-uninstall"
          cp packaging/systemd/rigsignal-agent.user-install.service    "dist-tar/${DIR}/rigsignal-agent.service"

          # eBPF daemon + probes + system service (installed by install.sh with sudo)
          cp target/ebpf/rigsignal-ebpf                                "dist-tar/${DIR}/rigsignal-ebpf"
          cp target/ebpf/rigsignal-ebpf-probes                         "dist-tar/${DIR}/rigsignal-ebpf-probes"
          cp packaging/systemd/rigsignal-ebpf.user-install.service     "dist-tar/${DIR}/rigsignal-ebpf.service"

          python3 tools/build_asset_bundle.py \
            --version "$VERSION" \
            --source-commit "${GITHUB_SHA}" \
            --engine-output "dist-tar/${DIR}/engine"

          chmod +x "dist-tar/${DIR}/rigsignal-agent" \
                   "dist-tar/${DIR}/rigsignal" \
                   "dist-tar/${DIR}/rigsignal-uninstall" \
                   "dist-tar/${DIR}/rigsignal-ebpf"
          cd dist-tar
          tar -czf "${DIR}.tar.gz" "${DIR}/"

      - name: Build asset bundle
        run: |
          python3 tools/build_asset_bundle.py \
            --version "${{ needs.setup.outputs.version }}" \
            --source-commit "${GITHUB_SHA}"

      - name: Upload tarball artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-tarball
          path: dist-tar/rigsignal-*-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Upload install.sh artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-sh
          path: packaging/install.sh
          if-no-files-found: error

      - name: Upload asset bundle artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asset-bundle
          path: dist/rigsignal-assets-*.tar.gz
          if-no-files-found: error

  # ── 2. Build Windows x86_64 release binary ──────────────────────────────────
  build-windows:
    name: build (windows x86_64)
    needs: setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master@2026-07-18
        with:
          toolchain: stable

      - name: Cache cargo registry + build artefacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src -> target

      - name: cargo build --release
        run: cargo build --release --manifest-path src/Cargo.toml --locked

      - name: Upload binary artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-binary-windows-x86_64
          path: target/release/rigsignal-agent.exe
          if-no-files-found: error

  # ── 3. .deb (Debian / Ubuntu) ───────────────────────────────────────────────
  package-deb:
    name: package .deb
    needs: [setup, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master@2026-07-18
        with:
          toolchain: stable

      - name: Download release binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-binary-linux-x86_64
          path: target/release/

      - name: Mark binary executable
        run: chmod +x target/release/rigsignal-agent

      - name: Stage asset engine
        run: |
          python3 tools/build_asset_bundle.py \
            --version "${{ needs.setup.outputs.version }}" \
            --source-commit "${GITHUB_SHA}" \
            --engine-output dist/engine

      - name: Install cargo-binstall (fast binary installer)
        uses: cargo-bins/cargo-binstall@0b24824336e2b3800b0f89d9e08b2c08bfa3dcdd # v1.17.9

      - name: Install cargo-deb
        run: cargo binstall cargo-deb --no-confirm

      - name: Build .deb
        run: cargo deb --manifest-path src/Cargo.toml --no-build --no-strip

      - name: Upload .deb artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-package
          path: target/debian/*.deb
          if-no-files-found: error

  # ── 4. .rpm (Fedora / RHEL / openSUSE) ──────────────────────────────────────
  package-rpm:
    name: package .rpm
    needs: [setup, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master@2026-07-18
        with:
          toolchain: stable

      - name: Download release binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-binary-linux-x86_64
          path: target/release/

      - name: Mark binary executable
        run: chmod +x target/release/rigsignal-agent

      - name: Stage asset engine
        run: |
          python3 tools/build_asset_bundle.py \
            --version "${{ needs.setup.outputs.version }}" \
            --source-commit "${GITHUB_SHA}" \
            --engine-output dist/engine

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@0b24824336e2b3800b0f89d9e08b2c08bfa3dcdd # v1.17.9

      - name: Install cargo-generate-rpm
        run: cargo binstall cargo-generate-rpm --no-confirm

      - name: Build .rpm
        run: cd src && cargo generate-rpm

      - name: Upload .rpm artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-package
          path: src/target/generate-rpm/*.rpm
          if-no-files-found: error

  # ── 5. .pkg.tar.zst (Arch Linux) ────────────────────────────────────────────
  package-arch:
    name: package .pkg.tar.zst
    needs: [setup, build-linux]
    runs-on: ubuntu-latest
    container: archlinux/archlinux@sha256:16191a338ed2338e17a3af7d164e9de871fbc2ae6b96f58a7bd3fedbb6e24dc2
    steps:
      - name: Install base-devel and git
        run: pacman -Syu --noconfirm base-devel git

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download release binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-binary-linux-x86_64
          path: target/release/

      - name: Mark binary executable
        run: chmod +x target/release/rigsignal-agent

      - name: Stage asset engine
        run: |
          python3 tools/build_asset_bundle.py \
            --version "${{ needs.setup.outputs.version }}" \
            --source-commit "${GITHUB_SHA}" \
            --engine-output dist/engine

      - name: Create unprivileged build user (makepkg refuses to run as root)
        run: |
          useradd -m builder
          chown -R builder:builder "$(pwd)"

      - name: Build Arch package
        run: |
          WORKSPACE="$(pwd)"
          # Arch makepkg disallows hyphens / colons / slashes in pkgver, but
          # semver pre-release tags (e.g. 0.2.0-rc1) and our own dispatch test
          # versions (e.g. 0.1.1-msitest1) contain hyphens. Translate hyphens
          # to underscores — Arch convention for pre-release versions.
          PKGVER="${{ needs.setup.outputs.version }}"
          PKGVER="${PKGVER//-/_}"
          su builder -c "
            cd '$WORKSPACE/.github/packaging'
            sed -i 's/^pkgver=.*/pkgver=$PKGVER/' PKGBUILD
            REPOROOT='$WORKSPACE' makepkg --nodeps --noextract --nosign
          "

      - name: Upload .pkg.tar.zst artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch-package
          path: .github/packaging/*.pkg.tar.zst
          if-no-files-found: error

  # ── 6. Windows .msi (cargo-wix + WiX Toolset 3) ─────────────────────────────
  # WiX 3 is pre-installed on windows-latest runners; cargo-wix is a small
  # cargo subcommand that drives candle.exe + light.exe with the wxs source
  # at .github/packaging/main.wxs. The MSI installs to Program Files\RigSignal\
  # and adds bin\ to the system PATH.
  package-windows:
    name: package .msi (windows)
    needs: [setup, build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master@2026-07-18
        with:
          toolchain: stable

      - name: Cache cargo registry + build artefacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src -> target

      - name: Download Windows binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-binary-windows-x86_64
          path: target/release/

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@0b24824336e2b3800b0f89d9e08b2c08bfa3dcdd # v1.17.9

      - name: Install cargo-wix
        # --force because Swatinem/rust-cache restores ~/.cargo/.crates2.json
        # but does NOT cache ~/.cargo/bin/. Without --force, binstall sees
        # the metadata, declares cargo-wix "already installed", and skips —
        # but the actual cargo-wix.exe binary is missing from the runner.
        run: cargo binstall cargo-wix --no-confirm --locked --force

      - name: Stage PresentMon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $targetDir = "target/release"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null

          $presentMonPath = Join-Path $targetDir "PresentMon.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/GameTechDev/PresentMon/releases/download/v2.4.1/PresentMon-2.4.1-x64.exe" `
            -OutFile $presentMonPath

          $expectedHash = "d74183e7ae630f72cd3690be0373ecbfdc6cbb86578148aab8fa2a7166068f34"
          $actualHash = (Get-FileHash -Algorithm SHA256 $presentMonPath).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "PresentMon SHA-256 mismatch: expected $expectedHash, got $actualHash"
          }

          $licensePath = Join-Path $targetDir "PresentMon-LICENSE.txt"
          try {
            Invoke-WebRequest `
              -Uri "https://raw.githubusercontent.com/GameTechDev/PresentMon/v2.4.1/LICENSE.txt" `
              -OutFile $licensePath
          } catch {
            $statusCode = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            if ($statusCode -eq 404) {
              Invoke-WebRequest `
                -Uri "https://raw.githubusercontent.com/GameTechDev/PresentMon/v2.4.1/LICENSE" `
                -OutFile $licensePath
            } else {
              throw
            }
          }

          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/GameTechDev/PresentMon/v2.4.1/THIRD_PARTY.txt" `
            -OutFile (Join-Path $targetDir "PresentMon-THIRD_PARTY.txt")

      - name: Build .msi
        shell: pwsh
        run: |
          cargo wix --no-build --nocapture `
            --include .github/packaging/main.wxs `
            src/Cargo.toml

      - name: Upload .msi artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-package
          path: target/wix/*.msi
          if-no-files-found: error

  # ── 7. Create GitHub Release ─────────────────────────────────────────────────
  # Only runs on a real tag push. workflow_dispatch is for CI testing — the
  # build + package jobs run, but no release is published.
  release:
    name: create github release
    needs: [setup, packaging-tests, build-ebpf, package-tarball, package-deb, package-rpm, package-arch, package-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all package artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-package'
          merge-multiple: true
          path: dist/

      - name: Download tarball and install.sh
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: 'linux-tarball'
          merge-multiple: true
          path: dist/

      - name: Copy install.sh to dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: install-sh
          path: dist/

      - name: Download asset bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: asset-bundle
          path: dist/

      - name: List release assets
        run: ls -lh dist/

      - name: Extract release notes from changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            { target = "## [" ver "]"
              hit = index($0, target) == 1 &&
                    (length($0) == length(target) ||
                     substr($0, length(target)+1, 1) ~ /[[:space:]]/)
              if (hit) found = 1
              if (found && !hit && /^## /) exit
              if (found) print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > "${{ runner.temp }}/release-notes.md"
          test -s "${{ runner.temp }}/release-notes.md"

      - name: Refuse an existing release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          error_file="${RUNNER_TEMP}/release-view.err"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --silent 2>"${error_file}"; then
            echo "ERROR: release already exists for ${TAG}; S8a expects a fresh RC" >&2
            exit 1
          fi
          if ! grep -q 'HTTP 404' "${error_file}"; then
            echo "ERROR: could not establish that ${TAG} has no release; refusing to continue" >&2
            cat "${error_file}" >&2
            exit 1
          fi

      - name: Assert exact release payload contract
        run: |
          set -euo pipefail
          VERSION="${{ needs.setup.outputs.version }}"
          expected=(
            "rigsignal_${VERSION}-1_amd64.deb"
            "rigsignal-${VERSION}-1.x86_64.rpm"
            "rigsignal-${VERSION}-1-x86_64.pkg.tar.zst"
            "rigsignal-${VERSION}-x86_64.msi"
            "rigsignal-${VERSION}-linux-x86_64.tar.gz"
            "install.sh"
            "rigsignal-assets-${VERSION}.tar.gz"
          )
          actual=()
          while IFS= read -r -d '' path; do
            name="${path##*/}"
            if [[ "${name}" == .* ]] || [[ -d "${path}" ]] || [[ ! -f "${path}" ]] || [[ -L "${path}" ]]; then
              echo "ERROR: dist contains invalid entry: ${name}" >&2
              exit 1
            fi
            actual+=("${name}")
          done < <(find dist -mindepth 1 -maxdepth 1 -print0)
          if [[ "$(printf '%s\n' "${actual[@]}" | sort | uniq -d)" ]]; then
            echo "ERROR: dist contains duplicate entry names" >&2
            exit 1
          fi
          if ! diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${actual[@]}" | sort); then
            echo "ERROR: dist must contain exactly the seven release payloads before checksumming" >&2
            exit 1
          fi

      - name: Generate per-asset SHA-256 checksum files
        run: |
          set -euo pipefail
          cd dist
          VERSION="${{ needs.setup.outputs.version }}"
          for asset in \
            "rigsignal_${VERSION}-1_amd64.deb" \
            "rigsignal-${VERSION}-1.x86_64.rpm" \
            "rigsignal-${VERSION}-1-x86_64.pkg.tar.zst" \
            "rigsignal-${VERSION}-x86_64.msi" \
            "rigsignal-${VERSION}-linux-x86_64.tar.gz" \
            install.sh \
            "rigsignal-assets-${VERSION}.tar.gz"; do
            sha256sum "$asset" > "${asset}.sha256"
          done

      - name: Generate canonical release asset manifest
        run: |
          set -euo pipefail
          tools/gen-release-manifest \
            --dist dist \
            --tag "${GITHUB_REF_NAME}" \
            --source-commit "${GITHUB_SHA}"
          actual_count="$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)"
          if [[ "${actual_count}" -ne 15 ]] || \
             find dist -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q . || \
             find dist -mindepth 1 -maxdepth 1 -name '.*' -print -quit | grep -q . || \
             [[ -e dist/release-assets.json.sha256 ]]; then
            echo "ERROR: final dist must be exactly 15 regular, non-hidden files (seven payloads, seven sidecars, release-assets.json)" >&2
            exit 1
          fi

      - name: Attest release assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          draft: true

      - name: Assert draft release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.setup.outputs.tag }}"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,publishedAt,tagName,isImmutable > "${RUNNER_TEMP}/release.json"
          python3 - "${TAG}" "${RUNNER_TEMP}/release.json" <<'PY'
          import json
          import pathlib
          import sys

          tag, json_path = sys.argv[1:]
          release = json.loads(pathlib.Path(json_path).read_text(encoding="utf-8"))
          failures = []
          if release.get("isDraft") is not True:
              failures.append("isDraft is not true")
          if release.get("publishedAt") is not None:
              failures.append("publishedAt is not null")
          if release.get("tagName") != tag:
              failures.append(f"tagName is {release.get('tagName')!r}, expected {tag!r}")
          if release.get("isImmutable") is True:
              failures.append("isImmutable is true for the new draft")
          if failures:
              raise SystemExit("ERROR: created release failed draft-state assertion: " + "; ".join(failures))
          PY
