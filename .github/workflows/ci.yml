name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src -> target
          key: ${{ matrix.os }}

      - name: cargo check
        run: cargo check --manifest-path src/Cargo.toml --locked

      - name: cargo clippy
        run: cargo clippy --manifest-path src/Cargo.toml --locked -- -D warnings

      - name: cargo check --features ebpf (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --manifest-path src/Cargo.toml --locked --features ebpf

      - name: cargo clippy --features ebpf (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --manifest-path src/Cargo.toml --locked --features ebpf -- -D warnings

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src/Cargo.toml -- --check

  smoke-test:
    name: smoke test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src -> target
          key: ubuntu-smoke

      - name: Build agent (debug)
        run: cargo build --manifest-path src/Cargo.toml --locked

      - name: Run smoke test
        run: bash scripts/smoke-test.sh ./target/debug/rigsignal-agent
