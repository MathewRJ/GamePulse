name: agent-ci

# Deterministic CI gates for the RigSignal multi-agent pipeline.
# No LLM calls — the user runs on Pro / Plus / free subscriptions and has
# no API keys. LLM audits run locally via `gpx audit security` and the
# optional `.githooks/pre-push` hook, not in this workflow.
#
# This workflow is additive to the existing `.github/workflows/ci.yml`,
# which covers Rust check / clippy / fmt across Linux + Windows.
# This file covers the integration package side: elastic-package checks,
# pipeline tests, dashboard token hygiene.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: package format / lint / static / asset checks
  # ---------------------------------------------------------------------------
  package-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no root manifest.yml
        id: gate
        run: |
          if [[ -f manifest.yml ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no root manifest.yml — skipping elastic-package jobs"
          fi

      - name: Install elastic-package
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          # GitHub release assets are versioned: elastic-package_<X.Y.Z>_linux_amd64.tar.gz.
          # Resolve latest via the API, then download the matching versioned filename.
          tag=$(curl -fsSL https://api.github.com/repos/elastic/elastic-package/releases/latest \
                  | jq -r .tag_name)
          version=${tag#v}
          curl -fsSL \
            "https://github.com/elastic/elastic-package/releases/download/${tag}/elastic-package_${version}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" elastic-package
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: elastic-package check
        if: steps.gate.outputs.run == 'true'
        run: elastic-package check

      - name: elastic-package test static
        if: steps.gate.outputs.run == 'true'
        run: elastic-package test static

      # NOTE: `elastic-package test asset` requires a running stack and is
      # therefore in the stack-bootstrapped `pipeline-tests` job below, not
      # here. Keep this job as the fast lint-only gate.

  # ---------------------------------------------------------------------------
  # Stage 2: stack-dependent tests (asset + pipeline)
  # Boots an Elastic stack via elastic-package and runs tests that need it.
  # ---------------------------------------------------------------------------
  pipeline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: package-static
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no root manifest.yml
        id: gate
        run: |
          if [[ -f manifest.yml ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install elastic-package
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          # GitHub release assets are versioned: elastic-package_<X.Y.Z>_linux_amd64.tar.gz.
          # Resolve latest via the API, then download the matching versioned filename.
          tag=$(curl -fsSL https://api.github.com/repos/elastic/elastic-package/releases/latest \
                  | jq -r .tag_name)
          version=${tag#v}
          curl -fsSL \
            "https://github.com/elastic/elastic-package/releases/download/${tag}/elastic-package_${version}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" elastic-package
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Boot stack
        if: steps.gate.outputs.run == 'true'
        run: elastic-package stack up -d --version 8.15.0

      - name: elastic-package test asset
        if: steps.gate.outputs.run == 'true'
        run: elastic-package test asset

      - name: elastic-package test pipeline
        if: steps.gate.outputs.run == 'true'
        run: elastic-package test pipeline

      - name: Tear down stack
        if: always() && steps.gate.outputs.run == 'true'
        run: elastic-package stack down

  # ---------------------------------------------------------------------------
  # Stage 3: dashboard NDJSON hygiene
  # No instance tokens may leak into committed dashboards.
  # ---------------------------------------------------------------------------
  dashboard-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for instance tokens in dashboards
        run: |
          fail=0
          shopt -s nullglob
          files=()
          for dir in kibana/dashboard dashboards dashboards/archive; do
            [[ -d "$dir" ]] || continue
            for f in "$dir"/*.json "$dir"/*.ndjson; do
              [[ -f "$f" ]] && files+=("$f")
            done
          done
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no dashboard files found; skipping"
            exit 0
          fi
          for f in "${files[@]}"; do
            for field in '"version":' '"created_at":' '"updated_at":' \
                         '"created_by":' '"updated_by":'; do
              if grep -q "${field}" "${f}"; then
                echo "::error file=${f}::contains instance token ${field}"
                fail=1
              fi
            done
          done
          exit $fail

  # ---------------------------------------------------------------------------
  # Final gate: every required job must pass
  # ---------------------------------------------------------------------------
  pr-gate:
    runs-on: ubuntu-latest
    needs:
      - package-static
      - pipeline-tests
      - dashboard-hygiene
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::one or more required jobs failed"
            exit 1
          fi
          echo "all required jobs passed"
