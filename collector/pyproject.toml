[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gamepulse-collector"
version = "0.1.0"
description = "GamePulse Linux telemetry collector"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psutil>=6.0",
]

[project.scripts]
gamepulse-collector = "gamepulse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gamepulse"]

[tool.ruff]
target-version = "py311"
line-length = 100
