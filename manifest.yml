format_version: "3.0.0"
name: gamepulse
title: "GamePulse"
version: 0.1.0
description: >
  Gaming telemetry for Elastic: FPS, GPU/CPU metrics, frame timing percentiles,
  and kernel-level scheduler, I/O, and GPU fence tracing via eBPF.
  Understand why games perform the way they do — down to scheduler migrations and
  shader compilation stutters.
type: integration
categories:
  - monitoring
  - custom
conditions:
  kibana:
    version: "^8.13.0 || ^9.0.0"
  elastic:
    subscription: basic
owner:
  github: MathewRJ
  type: community

policy_templates:
  - name: gamepulse
    title: GamePulse Gaming Telemetry
    description: >
      Collect gaming performance metrics and kernel telemetry via eBPF.
      Covers CPU, GPU, frame timing, memory, storage, network, audio, power,
      session lifecycle, discrete events, and scheduler/I/O/GPU kernel probes.
    inputs:
      - type: logfile
        title: Collect GamePulse metrics
        description: >
          Reads output from the GamePulse collector agent. Configure the path
          to the GamePulse log or named pipe output below.
        vars:
          - name: paths
            type: text
            title: Paths
            multi: true
            required: false
            show_user: true
            default:
              - /var/log/gamepulse/*.log
